<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meme Lab — Trump Chaos</title><link rel="stylesheet" href="style.css"></head><body>
<nav class="nav"><div class="container navin"><a class="brand" href="index.html">TRUMP <b>CHAOS</b></a><button class="menu" type="button">MENU</button><div class="links"><a href="index.html">HOME</a><a href="games.html">GAMES</a><a class="active" href="meme.html">MEME LAB</a><a href="about.html">ABOUT</a></div></div></nav>
<main class="container gamewrap"><div class="gamehead"><h1>MEME <span style="color:var(--gold)">LAB</span></h1><p>Make a silly poster and download it as an image.</p></div>
<div class="memegrid"><section class="panel"><h2>BUILD YOUR MEME</h2><div class="field"><label>TOP TEXT</label><input id="top" maxlength="38" placeholder="MAKE IT BIGGER"></div><div class="field"><label>BACKGROUND</label><select id="bg"><option value="blue">Blue</option><option value="red">Red</option><option value="gold">Gold</option><option value="dark">Dark</option></select></div><div class="field"><label>SIZE</label><input id="size" type="range" min="45" max="100" value="88"></div><div class="checkrow"><button class="btn" id="random">RANDOMIZE</button><button class="btn white" id="download">DOWNLOAD PNG</button></div><div class="notice">This is a parody meme generator. Generated text is fictional.</div></section>
<section class="panel"><div id="canvasWrap" class="preview"><div class="meme-title" id="title"></div><img id="memeImg" src="assets/trump.png" alt="Trump parody character"></div></section></div></main><footer class="footer"><div class="container">Unofficial parody/entertainment experience. Not affiliated with Donald Trump or any campaign.</div></footer>
<script src="app.js"></script><script>
const top=$("#top"),title=$("#title"),bg=$("#bg"),size=$("#size"),wrap=$("#canvasWrap"),img=$("#memeImg");
function update(){title.textContent=top.value;img.style.width=size.value+"%";const b={blue:"repeating-linear-gradient(45deg,#b9dcff,#b9dcff 12px,#9ecbff 12px,#9ecbff 24px)",red:"repeating-linear-gradient(45deg,#ffd0d0,#ffd0d0 12px,#ffb2b2 12px,#ffb2b2 24px)",gold:"repeating-linear-gradient(45deg,#fff0a5,#fff0a5 12px,#ffe06b 12px,#ffe06b 24px)",dark:"repeating-linear-gradient(45deg,#27344d,#27344d 12px,#1b263b 12px,#1b263b 24px)"};wrap.style.background=b[bg.value]}
[top,bg,size].forEach(x=>x.addEventListener("input",update));$("#random").onclick=()=>{const lines=["MAKE IT BIGGER","BEST BURGER EVER","HAIR MODE: MAX","WALL LEVEL: 9000","VERY SERIOUS BUSINESS","CHAOS PRESIDENT","BIGLY. VERY BIGLY."];top.value=lines[Math.floor(Math.random()*lines.length)];update()};
$("#download").onclick=()=>{const c=document.createElement("canvas"),ctx=c.getContext("2d"),w=900,h=900;c.width=w;c.height=h;const colors={blue:"#9ecbff",red:"#ffb2b2",gold:"#ffe06b",dark:"#1b263b"};ctx.fillStyle=colors[bg.value];ctx.fillRect(0,0,w,h);ctx.fillStyle="#fff";ctx.strokeStyle="#000";ctx.lineWidth=12;ctx.textAlign="center";ctx.font="900 58px Arial";ctx.strokeText(top.value||"TRUMP CHAOS",w/2,80);ctx.fillText(top.value||"TRUMP CHAOS",w/2,80);const image=new Image();image.onload=()=>{const iw=700,ih=700;ctx.drawImage(image,(w-iw)/2,120,iw,ih);const a=document.createElement("a");a.download="trump-chaos-meme.png";a.href=c.toDataURL("image/png");a.click()};image.src="assets/trump.png"};
update();
</script></body></html>
